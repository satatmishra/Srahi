<!DOCTYPE html><html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Srahi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1a1a2e;overflow:hidden}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px}
#status{color:#fff;font-size:30px;text-align:center;min-height:90px;line-height:1.4;padding:0 10px}
#sub{color:#8b8ba3;font-size:16px;text-align:center;min-height:24px}
#btn{width:240px;height:240px;border-radius:50%;border:6px solid #fff;background:#e94560;
display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;
touch-action:none;user-select:none;transition:transform .1s}
#btn.rec{background:#c7363f;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(233,69,96,.5)}70%{box-shadow:0 0 0 30px rgba(233,69,96,0)}100%{box-shadow:0 0 0 0 rgba(233,69,96,0)}}
#btn:active{transform:scale(.95)}
</style></head><body>
<div id="wrap">
<div id="status">Srahi</div>
<div id="sub"></div>
<div id="btn">बोलिए</div>
</div>
<script>
const uid = new URLSearchParams(location.search).get("uid") || "amma";
const statusEl = document.getElementById("status"), sub = document.getElementById("sub"),
      btn = document.getElementById("btn");
let rec, chunks = [], busy = false, wakeLock = null, talking = false;

async function keepAwake(){ try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") keepAwake(); });

async function pollBriefing(){
  try{
    const r = await fetch("/pending?uid="+uid); const d = await r.json();
    for(const m of d.messages){ await playAudio(m.audio); }
  }catch(e){}
  setTimeout(pollBriefing, 45000);
}

function playAudio(b64){
  return new Promise(res=>{
    const a = new Audio("data:audio/mpeg;base64,"+b64);
    talking = true; statusEl.textContent = "Srahi बोल रही है…";
    a.onended = ()=>{ talking=false; statusEl.textContent="Srahi"; res(); };
    a.onerror = ()=>{ talking=false; res(); };
    a.play();
  });
}

btn.addEventListener("click", async ()=>{
  await keepAwake();
  if(busy || talking) return;
  if(rec && rec.state==="recording"){ rec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    chunks=[]; rec = new MediaRecorder(stream);
    rec.ondataavailable = e=>chunks.push(e.data);
    rec.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      btn.classList.remove("rec"); statusEl.textContent="Srahi सुन रही है…";
      busy=true;
      const blob = new Blob(chunks, {type: rec.mimeType||"audio/webm"});
      const fd = new FormData(); fd.append("uid",uid); fd.append("audio",blob,"v.webm");
      try{
        const r = await fetch("/talk",{method:"POST",body:fd});
        const d = await r.json();
        if(d.audio) await playAudio(d.audio);
        else statusEl.textContent = "फिर से बोलिए";
        if(d.action && d.action.type==="dial" && d.action.number){
          statusEl.textContent = "कॉल लगा रही हूँ…";
          await new Promise(r=>setTimeout(r,1500));
          window.location.href = "tel:" + d.action.number;
        }
      }catch(e){ statusEl.textContent = "फिर से बोलिए"; }
      busy=false; statusEl.textContent="Srahi"; sub.textContent="";
    };
    rec.start(); btn.classList.add("rec"); statusEl.textContent="बोलिए…"; sub.textContent="बंद करने के लिए फिर दबाइए";
    setTimeout(()=>{ if(rec.state==="recording") rec.stop(); }, 30000);
  }catch(e){ statusEl.textContent="माइक की अनुमति दें"; }
});
pollBriefing();
</script></body></html>
